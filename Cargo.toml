[package]
name = "xtce-rs"
version = "0.1.0"
authors = ["Nicolae Mihalache <xpromache@gmail.com>"]
edition = "2021"
license = "MIT"
description ="Load XTCE mission databases, decode telemetry packets and encode telecommands"
repository = "https://github.com/xpromache/xtce-rs"
readme = "README.md"
keywords = ["xtce", "telemetry", "telecommand", "space", "ccsds"]
categories = ["aerospace", "encoding", "parser-implementations"]
exclude = ["tools/", "test.sh"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
roxmltree = "0.18"
bimap = "0.6"
hex = "0.4.2"
enum-map = "2.4.1"
log = "0.4.17"
thiserror = "1.0"
lasso = {version = "0.7", features = ["multi-threaded"]}
smallvec = {version = "1.10", features = ["union"]}

[dev-dependencies]
env_logger = "0.10.0"
rand = {version = "0.8", features = ["small_rng"]}

[profile.release]
debug = 1